<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clipx</title>
<link rel="icon" href="favicon.svg">
<style>
:root{--bg:#fafaf9;--fg:#18181b;--mut:#71717a;--line:#e4e4e7;--card:#fff;--acc:#18181b;--accfg:#fafafa;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--bar:#e4e4e7;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--fg:#e7e7e9;--mut:#8b8b93;--line:#26262a;--card:#121214;--acc:#e7e7e9;--accfg:#0b0b0c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--bar:#26262a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
nav .brand{font:600 16px var(--mono);padding:0 8px 16px;display:flex;align-items:center;gap:8px}
nav a{display:block;padding:6px 8px;text-decoration:none;color:var(--mut)}
nav a.on,nav a:hover{color:var(--fg);background:var(--line)}
nav .foot{position:absolute;bottom:16px;left:20px;right:12px;color:var(--mut);font-size:12px}
main{padding:24px 32px;max-width:1100px;width:100%}
h1{font-size:18px;margin:0 0 4px;font-weight:600}
h2{font-size:14px;margin:28px 0 10px;font-weight:600}
.sub{color:var(--mut);margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);padding:12px 14px}
.tile b{display:block;font:600 20px var(--mono)}
.tile span{color:var(--mut);font-size:12px}
.card{border:1px solid var(--line);background:var(--card);padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.pill{font:11px var(--mono);padding:1px 7px;border:1px solid currentColor}
.ready{color:var(--ok)}.cooling{color:var(--warn)}.needs-login,.bad{color:var(--bad)}.disabled{color:var(--mut)}
button,.btn{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--mut)}
button.pri,.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
textarea{font-family:var(--mono);font-size:12px;min-height:90px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-family:var(--mono)}
.q{display:grid;grid-template-columns:42px 1fr 64px;gap:8px;align-items:center;font-size:12px;margin-top:4px}
.q .bar{height:6px;background:var(--bar)}
.q .bar i{display:block;height:100%;background:var(--fg)}
.q .bar i.hi{background:var(--bad)}
.mut{color:var(--mut)}
.err{color:var(--bad);font-size:12px;margin-top:6px;word-break:break-word}
pre{background:var(--bg);border:1px solid var(--line);padding:10px 12px;overflow:auto;margin:6px 0;position:relative}
pre button{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 7px}
.tabs{display:flex;gap:0;margin-bottom:-1px}
.tabs button{border-bottom:none}
.tabs button.on{background:var(--bg)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:8px}
.chart div{flex:1;background:var(--fg);min-height:1px;position:relative}
.chart div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:2px 6px;font:11px var(--mono);white-space:nowrap}
.login{max-width:380px;margin:12vh auto;padding:0 20px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--acc);color:var(--accfg);padding:8px 14px;font-size:13px;display:none;max-width:420px}
.flow{border:1px dashed var(--mut);padding:14px 16px;margin:10px 0}
.hidden{display:none}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;padding:10px}nav .brand{padding:6px 8px}nav .foot{display:none}main{padding:18px}}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <h1>clipx</h1>
  <p class="sub">enter the admin token. it is in <code>~/.clipx/config.toml</code> on the box, and <code>clipx setup</code> printed it.</p>
  <form id="loginf"><input id="tok" type="password" placeholder="adm-…" autocomplete="current-password"><p></p><button class="pri">open dashboard</button><div id="loginerr" class="err"></div></form>
</div>
<div id="app" class="app hidden">
  <nav>
    <div class="brand"><img src="favicon.svg" width="18" height="18" alt="">clipx</div>
    <a href="#overview" data-p="overview">overview</a>
    <a href="#accounts" data-p="accounts">accounts</a>
    <a href="#keys" data-p="keys">api keys</a>
    <a href="#usage" data-p="usage">usage</a>
    <a href="#connect" data-p="connect">remote access</a>
    <a href="#settings" data-p="settings">settings</a>
    <div class="foot"><div id="ver"></div><a href="#" id="logout">sign out</a></div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=localStorage.getItem('clipx_token')||'';
let S=null, page='overview', flow=null, newKey=null, usageDays=7, usageData=null, reqs=null, importOpen=false, lastFp='';
const hashTok=location.hash.match(/token=([^&]+)/);
if(hashTok){TOKEN=decodeURIComponent(hashTok[1]);localStorage.setItem('clipx_token',TOKEN);history.replaceState(null,'',location.pathname+'#overview')}

async function api(path,opt={}){
  const r=await fetch('api/'+path,{...opt,headers:{'authorization':'Bearer '+TOKEN,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){showLogin('wrong or missing admin token');throw new Error('unauthorized')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('http '+r.status));
  return j;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function showLogin(err){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginerr').textContent=err||''}
$('#loginf').onsubmit=async e=>{e.preventDefault();TOKEN=$('#tok').value.trim();localStorage.setItem('clipx_token',TOKEN);await boot()};
$('#logout').onclick=e=>{e.preventDefault();localStorage.removeItem('clipx_token');TOKEN='';showLogin()};

const num=n=>n>=1e9?(n/1e9).toFixed(1)+'b':n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e4?(n/1e3).toFixed(0)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(n||0);
function dur(s){s=Math.max(0,Math.round(s));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'}
const ago=t=>t?dur(S.now-t)+' ago':'never';
const base=()=>S.tunnel.connected&&S.tunnel.public_url?S.tunnel.public_url.replace(/\/$/,''):S.local_url;
// A JS literal that is safe inside an HTML attribute: JSON-quote it, then HTML-escape it.
const js=v=>esc(JSON.stringify(v));
function copyBtn(text){return `<button onclick="navigator.clipboard.writeText(${js(text)});toast('copied')">copy</button>`}
function snippet(text){return `<pre>${esc(text)}${copyBtn(text)}</pre>`}

async function boot(){
  try{S=await api('state')}catch(e){if(e.message!=='unauthorized')showLogin(e.message);return}
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  route();
}
function route(){
  page=(location.hash.slice(1)||'overview').split('&')[0];
  document.querySelectorAll('nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===page));
  render();
  if(page==='usage')loadUsage();
}
window.onhashchange=route;
// Re-render only when something visible changed, so buttons are not swapped out under the cursor.
const fingerprint=()=>JSON.stringify({...S,now:0,uptime:page==='overview'?S.uptime:0,rss:page==='overview'?Math.round(S.rss/1e5):0});
async function refresh(){if(!TOKEN||document.hidden||$('#app').classList.contains('hidden'))return;try{S=await api('state');if(!busy()&&fingerprint()!==lastFp)render()}catch(e){}}
setInterval(refresh,3000);
const busy=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')};

function render(){
  $('#ver').textContent='v'+S.version+' · '+(S.rss/1048576).toFixed(1)+' mb';
  lastFp=fingerprint();
  const m=$('#main');
  m.innerHTML=({overview,accounts,keys,usage,connect,settings}[page]||overview)();
}

function overview(){
  const acc=S.accounts, ready=acc.filter(a=>a.status==='ready').length;
  const b=base();
  return `<h1>overview</h1><p class="sub">${S.tunnel.connected?'reachable at <a href="'+esc(S.tunnel.public_url)+'">'+esc(S.tunnel.public_url)+'</a>':'local only at '+esc(S.local_url)+' · <a href="#connect">turn on remote access</a>'}</p>
  <div class="tiles">
    <div class="tile"><b>${ready}/${acc.length}</b><span>accounts ready</span></div>
    <div class="tile"><b>${num(S.total_requests)}</b><span>requests since start</span></div>
    <div class="tile"><b class="${S.total_failures?'bad':''}">${num(S.total_failures)}</b><span>failed</span></div>
    <div class="tile"><b>${S.in_flight}</b><span>in flight</span></div>
    <div class="tile"><b>${(S.rss/1048576).toFixed(1)}</b><span>mb memory</span></div>
    <div class="tile"><b>${dur(S.uptime)}</b><span>uptime</span></div>
  </div>
  ${acc.length?'':`<div class="card" style="margin-top:16px"><b>no accounts yet.</b> <a href="#accounts">add a claude or chatgpt account</a> to start.</div>`}
  <h2>connect your tools</h2>
  <div class="card">
    <p class="mut" style="margin-top:0">use any clipx api key (<a href="#keys">create one</a>). pin a tool to one account with <code>${esc(b)}/a/&lt;label&gt;</code>, or a model with <code>model@label</code>.</p>
    <label>claude code</label>${snippet(`export ANTHROPIC_BASE_URL=${b}\nexport ANTHROPIC_AUTH_TOKEN=<clipx key>`)}
    <label>codex · ~/.codex/config.toml</label>${snippet(`model_provider = "clipx"\n\n[model_providers.clipx]\nname = "clipx"\nbase_url = "${b}/v1"\nenv_key = "CLIPX_API_KEY"\nwire_api = "responses"`)}
    <label>openai-compatible apps (chat completions, claude-* and gpt-* models)</label>${snippet(`base url: ${b}/v1\napi key:  <clipx key>`)}
  </div>
  <h2>recent requests</h2>${reqTable(S.recent)}`;
}

function reqTable(list){
  if(!list||!list.length)return '<p class="mut">nothing yet.</p>';
  return `<div class="card" style="padding:0;overflow:auto"><table><tr><th>when</th><th>account</th><th>model</th><th>path</th><th class="n">status</th><th class="n">in</th><th class="n">out</th><th class="n">ms</th></tr>
  ${list.map(r=>`<tr title="${esc(r.error||'')}"><td>${ago(r.ts)}</td><td>${esc(r.account)}</td><td class="mono">${esc(r.model)}</td><td class="mono mut">${esc(r.path)}</td><td class="n ${r.status>=400||r.error?'bad':''}">${r.error&&r.status<400?'err':r.status}</td><td class="n">${num(r.input)}</td><td class="n">${num(r.output)}</td><td class="n">${r.ms}</td></tr>`).join('')}</table></div>`;
}

function quota(a){
  if(!a.quota||!a.quota.length)return a.provider==='claude'||a.provider==='codex'?'<div class="mut" style="font-size:12px;margin-top:6px">quota shows after the first request</div>':'';
  return a.quota.map(q=>`<div class="q"><span class="mono">${esc(q.name)}</span><div class="bar"><i class="${q.used_pct>=90?'hi':''}" style="width:${q.used_pct}%"></i></div><span class="mono mut">${q.used_pct.toFixed(0)}%${q.resets_at?' · '+dur(q.resets_at-S.now):''}</span></div>`).join('');
}

function accounts(){
  const list=S.accounts.map(a=>{
    let st=a.status; if(st==='cooling')st+=' '+dur(a.cooldown_until-S.now);
    return `<div class="card"><div class="row">
      <b class="mono">${esc(a.label)}</b><span class="pill ${a.status}">${esc(st)}</span><span class="mut">${esc(a.provider)}${a.plan?' · '+esc(a.plan):''}${a.email?' · '+esc(a.email):''}</span><span class="grow"></span>
      <span class="mut mono" style="font-size:12px">${num(a.requests)} req · ${num(a.input_tokens)} in · ${num(a.output_tokens)} out</span></div>
      ${quota(a)}
      ${a.last_error?`<div class="err">${esc(a.last_error)}</div>`:''}
      <div class="row" style="margin-top:10px">
        <button onclick="patchAcc(${js(a.id)},{disabled:${!a.disabled}})">${a.disabled?'enable':'disable'}</button>
        ${a.status==='cooling'||a.status==='needs-login'||a.last_error?`<button onclick="patchAcc(${js(a.id)},{reset:true})">clear error</button>`:''}
        <button onclick="refreshAcc(${js(a.id)})" ${a.no_refresh?'disabled title="refresh off for this account"':''}>refresh token</button>
        <button onclick="renameAcc(${js(a.id)},${js(a.label)})">rename</button>
        <span class="mut" style="font-size:12px">priority</span>
        <button onclick="patchAcc(${js(a.id)},{priority:${a.priority-1}})">−</button><span class="mono">${a.priority}</span><button onclick="patchAcc(${js(a.id)},{priority:${a.priority+1}})">+</button>
        <span class="grow"></span>
        ${a.status==='needs-login'?`<button class="pri" onclick="startLogin(${js(a.provider)})">log in again</button>`:''}
        <button class="danger" onclick="delAcc(${js(a.id)},${js(a.label)})">remove</button>
      </div>
      <div class="mut" style="font-size:12px;margin-top:6px">token ${a.expires_at?(a.expires_at>S.now?'expires in '+dur(a.expires_at-S.now):'expired'):'expiry unknown'} · refreshed ${ago(a.last_refresh)}${a.no_refresh?' · refresh off':''} · used ${ago(a.last_used)}</div>
    </div>`}).join('');
  return `<h1>accounts</h1><p class="sub">subscription logins clipx rotates between. ${S.strategy==='round-robin'?'round-robin: spreads requests over the highest-priority accounts.':'fill-first: uses the highest-priority account until it hits a limit.'}</p>
  <div class="row"><button class="pri" onclick="startLogin('claude')">add claude account</button><button class="pri" onclick="startLogin('codex')">add chatgpt / codex account</button><button onclick="toggleImport()">import json</button></div>
  ${flow?flowBox():''}
  <div id="imp" class="flow ${importOpen?'':'hidden'}"><b>import</b><p class="mut" style="margin:4px 0">paste a CLIProxyAPI auth file (claude-*.json, codex-*.json) or a clipx account file. an array works too.</p>
    <textarea id="impjson" placeholder='{"type":"claude","access_token":"…","refresh_token":"…"}'></textarea>
    <label><input type="checkbox" id="impnr" style="width:auto"> do not refresh these tokens (another tool still owns them)</label>
    <p></p><button class="pri" onclick="doImport()">import</button></div>
  <h2>${S.accounts.length} account${S.accounts.length===1?'':'s'}</h2>${list||'<p class="mut">none yet.</p>'}`;
}
function flowBox(){
  return `<div class="flow"><b>add ${esc(flow.provider)} account</b>
   <p style="margin:6px 0">1. <a class="btn pri" href="${esc(flow.url)}" target="_blank" rel="noopener">open sign-in page</a></p>
   <p class="mut" style="margin:6px 0">2. ${esc(flow.hint)}</p>
   <input id="cb" placeholder="${flow.provider==='claude'?'code#state':'http://localhost:1455/auth/callback?code=…'}">
   <p></p><div class="row"><button class="pri" onclick="completeLogin()">add account</button><button onclick="flow=null;render()">cancel</button></div><div id="flowerr" class="err"></div></div>`;
}
async function startLogin(p){try{const r=await api('login/start',{method:'POST',body:{provider:p}});flow={...r,provider:p};location.hash='accounts';render();pollFlow()}catch(e){toast(e.message)}}
async function pollFlow(){const id=flow&&flow.flow_id;while(flow&&flow.flow_id===id){await new Promise(r=>setTimeout(r,2000));if(!flow||flow.flow_id!==id)return;try{const s=await api('login/status/'+id);if(s.done){flow=null;S=await api('state');render();toast('account added');return}}catch(e){return}}}
async function completeLogin(){const v=$('#cb').value.trim();if(!v)return;try{const r=await api('login/complete',{method:'POST',body:{flow_id:flow.flow_id,callback:v}});flow=null;S=await api('state');render();toast('added '+r.account.label)}catch(e){$('#flowerr').textContent=e.message}}
function toggleImport(){importOpen=!importOpen;$('#imp').classList.toggle('hidden',!importOpen)}
async function doImport(){let j;try{j=JSON.parse($('#impjson').value)}catch(e){return toast('not valid json')}
  if($('#impnr').checked){(Array.isArray(j)?j:[j]).forEach(x=>x.no_refresh=true)}
  try{const r=await api('accounts/import',{method:'POST',body:j});importOpen=false;S=await api('state');render();toast('imported '+r.accounts.length)}catch(e){toast(e.message)}}
async function patchAcc(id,body){try{await api('accounts/'+id,{method:'PATCH',body});S=await api('state');render()}catch(e){toast(e.message)}}
async function refreshAcc(id){toast('refreshing…');try{await api('accounts/'+id+'/refresh',{method:'POST'});S=await api('state');render();toast('token refreshed')}catch(e){toast(e.message)}}
async function renameAcc(id,cur){const l=prompt('new label (no spaces)',cur);if(l&&l!==cur)patchAcc(id,{label:l})}
async function delAcc(id,label){if(!confirm('remove '+label+'? its tokens are deleted from this box.'))return;try{await api('accounts/'+id,{method:'DELETE'});S=await api('state');render()}catch(e){toast(e.message)}}

function keys(){
  return `<h1>api keys</h1><p class="sub">tools send one of these as their api key. clipx keeps only a hash, so a key is shown once.</p>
  <div class="row" style="max-width:520px"><input id="kname" placeholder="name, e.g. laptop"><button class="pri" onclick="mkKey()">create key</button></div>
  ${newKey?`<div class="flow"><b>${esc(newKey.name)}</b>: copy it now, it will not be shown again.${snippet(newKey.key)}<button onclick="newKey=null;render()">done</button></div>`:''}
  <h2>${S.keys.length} key${S.keys.length===1?'':'s'}</h2>
  <div class="card" style="padding:0"><table><tr><th>name</th><th>key</th><th>created</th><th>last used</th><th></th></tr>
  ${S.keys.map(k=>`<tr><td>${esc(k.name)}</td><td class="mono">${esc(k.prefix)}…</td><td>${ago(k.created_at)}</td><td>${ago(k.last_used)}</td><td class="n"><button class="danger" onclick="rmKey(${js(k.id)},${js(k.name)})">revoke</button></td></tr>`).join('')}</table></div>`;
}
async function mkKey(){try{newKey=await api('keys',{method:'POST',body:{name:$('#kname').value}});S=await api('state');render()}catch(e){toast(e.message)}}
async function rmKey(id,n){if(!confirm('revoke '+n+'? tools using it stop working.'))return;try{await api('keys/'+id,{method:'DELETE'});S=await api('state');render()}catch(e){toast(e.message)}}

async function loadUsage(){try{[usageData,reqs]=await Promise.all([api('usage?days='+usageDays),api('requests?limit=100')]);if(page==='usage')render()}catch(e){}}
function usage(){
  const d=usageData;
  const tabs=[1,7,30,90].map(n=>`<button class="${n===usageDays?'on':''}" onclick="usageDays=${n};loadUsage()">${n===1?'today':n+' days'}</button>`).join('');
  if(!d)return `<h1>usage</h1><p class="mut">loading…</p>`;
  const days=Object.entries(d.by_day), max=Math.max(1,...days.map(([,t])=>t.input+t.output));
  const tbl=(title,obj)=>{const rows=Object.entries(obj).sort((a,b)=>b[1].requests-a[1].requests);return `<h2>${title}</h2><div class="card" style="padding:0;overflow:auto"><table><tr><th>${title.split(' ')[1]}</th><th class="n">requests</th><th class="n">failed</th><th class="n">input</th><th class="n">cached</th><th class="n">output</th></tr>${rows.map(([k,t])=>`<tr><td class="mono">${esc(k)}</td><td class="n">${num(t.requests)}</td><td class="n">${num(t.failures)}</td><td class="n">${num(t.input)}</td><td class="n">${num(t.cache_read)}</td><td class="n">${num(t.output)}</td></tr>`).join('')||'<tr><td class="mut">nothing yet</td></tr>'}</table></div>`};
  return `<h1>usage</h1><p class="sub">what clipx saw pass through, kept for 90 days. not a bill.</p>
  <div class="tabs">${tabs}</div>
  <div class="card"><div class="mut" style="font-size:12px">tokens per day</div><div class="chart">${days.map(([day,t])=>`<div style="height:${Math.max(1,(t.input+t.output)/max*100)}%" data-t="${day}: ${num(t.input)} in, ${num(t.output)} out, ${t.requests} req"></div>`).join('')||'<span class="mut">nothing yet</span>'}</div></div>
  ${tbl('by account',d.by_account)}${tbl('by model',d.by_model)}
  <h2>last requests</h2>${reqTable(reqs)}`;
}

function connect(){
  const t=S.tunnel,c=S.connect;
  const st=c.mode==='off'?'<span class="pill disabled">off</span>':t.connected?'<span class="pill ready">connected</span>':'<span class="pill cooling">connecting</span>';
  return `<h1>remote access</h1><p class="sub">reach this box over https from anywhere, without opening ports.</p>
  <div class="card"><div class="row">${st}<span class="grow">${t.connected?'<a class="mono" href="'+esc(t.public_url)+'">'+esc(t.public_url)+'</a>':''}</span></div>
  ${t.error&&!t.connected?`<div class="err">${esc(t.error)}</div>`:''}
  ${S.via_tunnel?'<p class="mut" style="font-size:12px">you are viewing this page through the tunnel.</p>':''}</div>
  <h2>mode</h2>
  <div class="card">
   <label><input type="radio" name="mode" value="cloudflare" style="width:auto" ${c.mode==='cloudflare'?'checked':''}> cloudflare quick tunnel: no account, no server. the url changes when clipx restarts.</label>
   <label><input type="radio" name="mode" value="relay" style="width:auto" ${c.mode==='relay'?'checked':''}> clipx relay: a stable url from a relay you run (<code>clipx relay</code> on any small server).</label>
   <label><input type="radio" name="mode" value="off" style="width:auto" ${c.mode==='off'?'checked':''}> off: local only.</label>
   <div id="relayf"><label>relay url</label><input id="rurl" value="${esc(c.relay||'')}" placeholder="https://relay.example.com">
   <label>name on the relay</label><input id="rname" value="${esc(c.name||'')}" placeholder="my-box">
   <label>relay secret (only if the relay asks for one)</label><input id="rsec" type="password"></div>
   <p></p><button class="pri" onclick="saveConnect()">save</button>
  </div>`;
}
async function saveConnect(){const mode=document.querySelector('input[name=mode]:checked').value;try{await api('connect',{method:'PATCH',body:{mode,relay:$('#rurl').value,name:$('#rname').value,relay_secret:$('#rsec').value}});toast('saved, connecting…');setTimeout(refresh,1500)}catch(e){toast(e.message)}}

function settings(){
  return `<h1>settings</h1><p class="sub">changes apply right away.</p>
  <div class="card" style="max-width:560px">
   <label>routing</label><select id="strat"><option value="round-robin" ${S.strategy==='round-robin'?'selected':''}>round-robin: spread load across accounts</option><option value="fill-first" ${S.strategy==='fill-first'?'selected':''}>fill-first: use one account until it hits a limit</option></select>
   <label>accounts to try per request before giving up</label><input id="retries" type="number" min="1" max="10" value="${S.retries}">
   <p></p><button class="pri" onclick="saveSettings()">save</button>
  </div>
  <h2>about</h2><div class="card mut" style="max-width:560px;font-size:13px">
   listening on <code>${esc(S.listen)}</code><br>
   presents as claude code <code>${esc(S.claude_version)}</code> to anthropic for non-claude-code clients (raised automatically when a newer claude code passes through)<br>
   admin token lives in <code>~/.clipx/config.toml</code></div>`;
}
async function saveSettings(){try{await api('settings',{method:'PATCH',body:{strategy:$('#strat').value,retries:+$('#retries').value}});S=await api('state');render();toast('saved')}catch(e){toast(e.message)}}

if(TOKEN)boot();else showLogin();
</script>
</body>
</html>
